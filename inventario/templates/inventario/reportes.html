{% extends 'core/base.html' %}
{% load static %}

{% block title %}Reportes{% endblock %}

{% block content %}
<div class="reportes-container" style="padding: 20px;">
    
    <!-- Header -->
    <div style="background-color: #f39c12; padding: 15px; border-radius: 5px; color: white; margin-bottom: 20px;">
        <h1 style="margin:0;">📋 REPORTES</h1>
        <p>La función Reportes permitirá generar información del sistema.</p>
    </div>

    <!-- Panel de Reportes -->
    <div style="background-color: #1a2a3a; padding: 20px; border-radius: 8px; color: white;">
        <h2 style="border-bottom: 1px solid #333; padding-bottom: 10px;">REPORTES DISPONIBLES</h2>
        
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px;">
            <!-- Ítems (Cambiamos el for para usar la lista 'nombres' enviada desde views.py) -->
            {% for nombre in nombres %}
            <div style="background-color: #2c3e50; padding: 30px; text-align: center; border-radius: 5px; border: 1px solid #34495e;">
                <div style="font-size: 40px; margin-bottom: 10px;">📄</div>
                <h3>{{ nombre }}</h3>
            </div>
            {% endfor %}
        </div>

        <!-- Botones de Acción -->
        <div style="margin-top: 30px; display: flex; gap: 10px;">
            <button class="btn" style="background: #34495e; color: white; padding: 10px 20px; border: none; cursor: pointer;">👁 Vista previa</button>
            <button class="btn" style="background: #c0392b; color: white; padding: 10px 20px; border: none; cursor: pointer;">PDF Exportar PDF</button>
            <button class="btn" style="background: #27ae60; color: white; padding: 10px 20px; border: none; cursor: pointer;">XLS Exportar Excel</button>
            <button class="btn" style="background: #546e7a; color: white; padding: 10px 20px; border: none; cursor: pointer;">🖨 Imprimir</button>
        </div>
    </div>
</div>
{% endblock %}
