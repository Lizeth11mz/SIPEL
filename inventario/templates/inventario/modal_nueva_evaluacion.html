<!-- Modal para Nueva Inscripción -->
<div id="modalInscripcion" class="modal-container" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
    <div class="modal-content" style="background-color: #2c3e50; margin: 2% auto; padding: 20px; border: 1px solid #888; width: 500px; border-radius: 8px; color: white;">
        
        <!-- Header -->
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background-color: #f39c12; padding: 10px; margin: -20px -20px 20px -20px; border-radius: 8px 8px 0 0;">
            <h2 style="margin: 0; font-size: 1.5em; color: #2c3e50;">NUEVA INSCRIPCIÓN</h2>
            <span style="font-size: 28px; font-weight: bold; cursor: pointer; color: #2c3e50;" onclick="closeInscripcionModal()">&times;</span>
        </div>

        <form method="post" action="{% url 'inventario:crear_inscripcion' %}">
            {% csrf_token %}

            <!-- Campos -->
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Estudiante</label>
                <select name="estudiante_id" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                    <option value="" disabled selected>Seleccione un estudiante...</option>
                    {% for est in estudiantes %}
                        <option value="{{ est.id }}">{{ est.nombre_completo }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Curso</label>
                <select name="curso_id" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                    <option value="" disabled selected>Seleccione un curso...</option>
                    {% for curso in cursos %}
                        <option value="{{ curso.id }}">{{ curso.nombre_curso }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Instructor</label>
                <select name="instructor_id" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                    <option value="" disabled selected>Seleccione un instructor...</option>
                    {% for ins in instructores %}
                        <option value="{{ ins.id }}">{{ ins.nombre_completo }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Folio</label>
                <input type="text" name="folio_inscripcion" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Fecha</label>
                <input type="date" name="fecha_inscripcion" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Estado</label>
                <select name="estado" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Total Pago</label>
                <input type="number" name="total_pago" step="0.01" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
            </div>

            <!-- Botones -->
            <div style="text-align: right; margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="closeInscripcionModal()" style="width: 120px; padding: 10px; cursor: pointer; background: #95a5a6; border: none; color: white;">Cerrar</button>
                <button type="submit" style="width: 120px; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer;">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script>
    function closeInscripcionModal() { document.getElementById('modalInscripcion').style.display = 'none'; }
    function openInscripcionModal() { document.getElementById('modalInscripcion').style.display = 'block'; }
    
    window.onclick = function(event) {
        var modal = document.getElementById('modalInscripcion');
        if (event.target == modal) { modal.style.display = 'none'; }
    }
</script>
