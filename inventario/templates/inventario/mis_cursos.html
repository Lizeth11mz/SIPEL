{% extends 'core/base_instructor.html' %}
{% block title %}Mis Cursos{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-6">📘 Mis Cursos Asignados</h1>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    {% for curso in mis_cursos %}
    <div class="bg-white p-6 rounded shadow border-l-4 border-blue-500">
        <h2 class="font-bold text-xl">{{ curso.nombre_curso }}</h2>
        <p class="text-gray-600">{{ curso.descripcion }}</p>
    </div>
    {% empty %}
    <p>No tienes cursos asignados actualmente.</p>
    {% endfor %}
</div>
{% endblock %}
