{% extends 'core/base_instructor.html' %}

{% block title %}Registrar Calificación{% endblock %}

{% block content %}
<div class="card" style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 40px auto; border-top: 5px solid #104274;">
    
    <h2 style="color: #104274; margin-top: 0; margin-bottom: 10px;">Registrar Calificación</h2>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
    
    <div style="margin-bottom: 20px; color: #555;">
        <p style="margin: 5px 0;">Estudiante: <strong style="color: #333;">{{ inscripcion.estudiante.nombre_completo }}</strong></p>
        <p style="margin: 5px 0;">Curso: <strong style="color: #333;">{{ inscripcion.curso.nombre_curso }}</strong></p>
    </div>
    
    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label style="font-weight: bold; color: #333;">Calificación (0-100):</label><br>
            <input type="number" name="calificacion" min="0" max="100" required 
                   style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="font-weight: bold; color: #333;">Comentarios:</label><br>
            <textarea name="comentarios" rows="4" 
                      style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 5px;"></textarea>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" style="flex: 1; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                💾 Guardar Nota
            </button>
            <a href="{% url 'inventario:evaluar_alumnos' %}" 
               style="flex: 1; padding: 12px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; text-align: center; font-weight: bold;">
               Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
