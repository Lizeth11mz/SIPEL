<div id="newStudentModal" class="modal-container" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
    <div class="modal-content" style="background-color: #2c3e50; margin: 3% auto; padding: 20px; border: 1px solid #888; width: 500px; border-radius: 8px; color: white;">
        
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background-color: #f39c12; padding: 10px; margin: -20px -20px 20px -20px; border-radius: 8px 8px 0 0;">
            <h2 style="margin: 0; font-size: 1.5em; color: #2c3e50;">NUEVO ESTUDIANTE</h2>
            <span style="font-size: 28px; font-weight: bold; cursor: pointer; color: #2c3e50;" onclick="closeNewStudentModal()">&times;</span>
        </div>

        <form method="post" action="{% url 'inventario:crear_estudiantes' %}">
            {% csrf_token %}

            <!-- Usuario -->
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px;">USUARIO:</label>
                <input type="text" name="usuario" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
            </div>

            <!-- Contrasena -->
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px;">CONTRASEÑA:</label>
                <input type="password" name="contrasena" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
            </div>

            <!-- Nombre Completo -->
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px;">NOMBRE COMPLETO:</label>
                <input type="text" name="nombre_completo" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
            </div>
            
            <!-- Email -->
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px;">CORREO:</label>
                <input type="email" name="email" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
            </div>

            <!-- Teléfono -->
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px;">TELÉFONO:</label>
                <input type="text" name="telefono" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;">
            </div>

            <!-- Dirección -->
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px;">DIRECCIÓN:</label>
                <input type="text" name="direccion" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;">
            </div>
            
            <!-- Documentos -->
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 4px;">TIPO DE DOCUMENTO:</label>
                    <select name="tipo_documento" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                        <option value="INE">INE</option>
                        <option value="ACTA">ACTA DE NACIMIENTO</option>
                        <option value="CURP">CURP</option>
                        <option value="PASAPORTE">PASAPORTE</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 4px;">NÚMERO DE DOCUMENTO:</label>
                    <input type="text" name="numero_documento" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                </div>
            </div>

            <!-- Estado (Despliegue Activo / Inactivo) -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 4px;">ESTADO:</label>
                <select name="estado" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                    <option value="Activo" selected>ACTIVO</option>
                    <option value="Inactivo">INACTIVO</option>
                </select>
            </div>
            
            <!-- Botones -->
            <div style="text-align: right; margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="closeNewStudentModal()" style="width: 120px; padding: 10px; cursor: pointer; background: #95a5a6; border: none; color: white; border-radius: 4px;">Cerrar</button>
                <button type="submit" style="width: 120px; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px;">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script>
    function closeNewStudentModal() {
        document.getElementById('newStudentModal').style.display = 'none';
    }
    function openNewStudentModal() {
        document.getElementById('newStudentModal').style.display = 'block';
    }
    window.onclick = function(event) {
        var modal = document.getElementById('newStudentModal');
        if (event.target == modal) {
            modal.style.display = 'none';
        }
    }
</script>
