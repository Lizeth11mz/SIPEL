<div id="newInstructorModal" class="modal-container" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
    <div class="modal-content" style="background-color: #2c3e50; margin: 2% auto; padding: 20px; border: 1px solid #888; width: 650px; border-radius: 8px; color: white;">
        
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background-color: #f39c12; padding: 10px; margin: -20px -20px 20px -20px; border-radius: 8px 8px 0 0;">
            <h2 class="header-title" style="margin: 0; font-size: 1.5em; color: #2c3e50;">NUEVO INSTRUCTOR</h2>
            <span style="font-size: 28px; font-weight: bold; cursor: pointer; color: #2c3e50;" onclick="closeNewInstructorModal()">&times;</span>
        </div>

        <form method="post" action="{% url 'inventario:crear_instructor' %}">
            {% csrf_token %}

            <!-- 1. Nombre Completo -->
            <div class="form-group" style="margin-bottom: 15px;">
                <label>NOMBRE COMPLETO</label>
                <input type="text" name="nombre_completo" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white; text-transform: uppercase;" required>
            </div>

            <!-- 2 y 3. Especialidad y Cédula Profesional -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;"><label>ESPECIALIDAD</label><input type="text" name="especialidad" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white; text-transform: uppercase;" required></div>
                <div style="flex: 1;"><label>CÉDULA PROFESIONAL</label><input type="text" name="cedula_profesional" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white; text-transform: uppercase;" required></div>
            </div>

            <!-- 4 y 5. Usuario y Contraseña -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;"><label>USUARIO</label><input type="text" name="usuario" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required></div>
                <div style="flex: 1;"><label>CONTRASEÑA</label><input type="password" name="contrasena" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required></div>
            </div>

            <!-- 6 y 7. Correo y Teléfono -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;"><label>CORREO (EMAIL)</label><input type="email" name="email" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required></div>
                <div style="flex: 1;"><label>TELÉFONO</label><input type="text" name="telefono" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required></div>
            </div>

            <!-- 8. Dirección -->
            <div class="form-group" style="margin-bottom: 15px;">
                <label>DIRECCIÓN</label>
                <input type="text" name="direccion" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white; text-transform: uppercase;" required>
            </div>

            <!-- 9. Estado -->
            <div class="form-group" style="margin-bottom: 15px;">
                <label>ESTADO</label>
                <select name="estado" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                    <option value="Activo" selected>ACTIVO</option>
                    <option value="Inactivo">INACTIVO</option>
                </select>
            </div>
            
            <!-- Botones -->
            <div style="text-align: right; margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn-cancelar" onclick="closeNewInstructorModal()" style="width: 120px; padding: 10px; cursor: pointer; background: #95a5a6; border: none; color: white; font-weight: bold;">CERRAR</button>
                <button type="submit" class="btn-primary" style="width: 120px; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold;">GUARDAR</button>
            </div>
        </form>
    </div>
</div>

<script>
    function closeNewInstructorModal() { document.getElementById('newInstructorModal').style.display = 'none'; }
    function openNewInstructorModal() { document.getElementById('newInstructorModal').style.display = 'block'; }
    window.onclick = function(event) {
        var modal = document.getElementById('newInstructorModal');
        if (event.target == modal) { modal.style.display = 'none'; }
    }
</script>
