<div id="newInstructorModal" class="modal-container" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
    <div class="modal-content" style="background-color: #2c3e50; margin: 2% auto; padding: 20px; border: 1px solid #888; width: 650px; border-radius: 8px; color: white;">
        
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background-color: #f39c12; padding: 10px; margin: -20px -20px 20px -20px; border-radius: 8px 8px 0 0;">
            <h2 class="header-title" style="margin: 0; font-size: 1.5em; color: #2c3e50;">NUEVO INSTRUCTOR</h2>
            <span style="font-size: 28px; font-weight: bold; cursor: pointer; color: #2c3e50;" onclick="closeNewInstructorModal()">&times;</span>
        </div>

        <form method="post" action="{% url 'inventario:crear_instructor' %}">
            {% csrf_token %}

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Usuario del Sistema</label>
                <select name="usuario_id" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                    <option value="" disabled selected>Seleccione un usuario...</option>
                    {% for user in usuarios %}
                        <option value="{{ user.id }}">{{ user.username }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Fila: Nombre y Apellidos -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;"><label>Nombre</label><input type="text" name="nombre" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required></div>
                <div style="flex: 1;"><label>Ap. Paterno</label><input type="text" name="apellido_paterno" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required></div>
                <div style="flex: 1;"><label>Ap. Materno</label><input type="text" name="apellido_materno" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required></div>
            </div>

            <!-- Fila: Especialidad y Teléfono -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;"><label>Especialidad</label><input type="text" name="especialidad" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required></div>
                <div style="flex: 1;"><label>Teléfono</label><input type="text" name="telefono" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required></div>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Dirección</label>
                <input type="text" name="direccion" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
            </div>

            <!-- Fila: Tipo Documento y Número de Identificación -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label>Tipo Documento</label>
                    <select name="tipo_documento" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                        <option value="INE">INE</option>
                        <option value="CURP">CURP</option>
                        <option value="Pasaporte">Pasaporte</option>
                        <option value="Cedula">Cédula Profesional</option>
                        <option value="Acta_Nacimiento">Acta de Nacimiento</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Número de Identificación</label>
                    <input type="text" name="numero_documento" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Número de Cédula Profesional</label>
                <input type="text" name="cedula" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Estado</label>
                <select name="estado" style="width: 100%; padding: 8px; background-color: #1a252f; border: 1px solid #34495e; color: white;" required>
                    <option value="Activo" selected>Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>
            
            <div style="text-align: right; margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn-cancelar" onclick="closeNewInstructorModal()" style="width: 120px; padding: 10px; cursor: pointer; background: #95a5a6; border: none; color: white;">Cerrar</button>
                <button type="submit" class="btn-primary" style="width: 120px; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer;">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script>
    function closeNewInstructorModal() { document.getElementById('newInstructorModal').style.display = 'none'; }
    function openNewInstructorModal() { document.getElementById('newInstructorModal').style.display = 'block'; }
    window.onclick = function(event) {
        var modal = document.getElementById('newInstructorModal');
        if (event.target == modal) { modal.style.display = 'none'; }
    }
</script>
