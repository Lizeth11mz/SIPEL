<div id="modalInscripcion" class="modal-container" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000;">
    <div class="modal-content" style="background: white; width: 900px; padding: 30px; border-radius: 10px; position: relative; font-family: 'Segoe UI', sans-serif;">
        
        <!-- Botón cerrar -->
        <span onclick="closeInscripcionModal()" style="position: absolute; top: 20px; right: 25px; font-size: 22px; cursor: pointer; color: #666;">&times;</span>

        <h2 style="margin-top: 0; color: #1a252f; display: flex; align-items: center; gap: 10px;">
            📝 Registrar Nueva Inscripción (Administrador)
        </h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Selecciona el estudiante y el curso. El instructor se asignará automáticamente.</p>

        <form method="POST" action="{% url 'inventario:crear_inscripciones' %}" id="formInscripcion">
            {% csrf_token %}
            
            <!-- Input oculto para enviar el estado del pago automáticamente según el botón -->
            <input type="hidden" name="estado" id="estado_pago">

            <div style="display: flex; gap: 30px;">
                
                <!-- Columna Izquierda: Cursos Disponibles -->
                <div style="flex: 1; border-right: 1px solid #eee; padding-right: 20px;">
                    <label style="font-weight: bold; color: #333; display: block; margin-bottom: 10px;">Cursos Disponibles</label>
                    
                    <div style="max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px;">
                        {% for curso in cursos %}
                        <label style="border: 1px solid #ddd; padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;">
                            <div>
                                <strong style="display: block; color: #333;">{{ curso.nombre_curso }}</strong>
                                <span style="color: #666; font-size: 13px; display: block;">Instructor: {{ curso.instructor.nombre_completo }}</span>
                                <span style="color: #2e7d32; font-weight: bold; font-size: 14px;">${{ curso.costo|default:"0.00" }}</span>
                            </div>
                            <input type="radio" name="curso" value="{{ curso.curso_id }}" data-instructor-id="{{ curso.instructor.instructor_id }}" data-instructor-nombre="{{ curso.instructor.nombre_completo }}" required style="cursor: pointer;" onchange="seleccionarInstructor(this)">
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <!-- Columna Derecha: Detalles del Registro -->
                <div style="flex: 1; display: flex; flex-direction: column; gap: 15px;">
                    
                    <!-- Selector de Estudiante -->
                    <div>
                        <label style="font-weight: bold; color: #333; display: block; margin-bottom: 5px; font-size: 14px;">Estudiante</label>
                        <select name="estudiante" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: white;">
                            <option value="">-- Selecciona un estudiante --</option>
                            {% for estudiante in estudiantes %}
                                <option value="{{ estudiante.estudiante_id }}">{{ estudiante.nombre_completo }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Instructor Automático -->
                    <div>
                        <label style="font-weight: bold; color: #333; display: block; margin-bottom: 5px; font-size: 14px;">Instructor Asignado</label>
                        <input type="text" id="instructor_display" placeholder="Se seleccionará automáticamente..." readonly style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #f8f9fa; color: #555; box-sizing: border-box;">
                        <input type="hidden" name="instructor" id="instructor_id">
                    </div>

                    <!-- Método de Pago -->
                    <div>
                        <label style="font-weight: bold; color: #333; display: block; margin-bottom: 5px; font-size: 14px;">Método de Pago</label>
                        <select name="metodo_pago" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: white;">
                            <option value="">-- Selecciona método de pago --</option>
                            <option value="Tarjeta de crédito">Tarjeta de crédito</option>
                            <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                            <option value="Transferencia bancaria">Transferencia bancaria</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="PayPal">PayPal</option>
                        </select>
                    </div>

                    <!-- Referencia de Pago -->
                    <div>
                        <label style="font-weight: bold; color: #333; display: block; margin-bottom: 5px; font-size: 14px;">Referencia de Pago</label>
                        <input type="text" name="folio_inscripcion" placeholder="Ej. REF12345678" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                    </div>

                </div>
            </div>

            <!-- Botones de Acción inferiores -->
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                <button type="submit" onclick="enviarEstado('Cancelado')" style="padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Cancelar</button>
                <button type="submit" onclick="enviarEstado('Pagado')" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Registrar Inscripción</button>
            </div>

        </form>
    </div>
</div>

<!-- Script de JavaScript -->
<script>
    function seleccionarInstructor(radio) {
        const instructorId = radio.getAttribute('data-instructor-id');
        const instructorNombre = radio.getAttribute('data-instructor-nombre');
        
        document.getElementById('instructor_id').value = instructorId;
        document.getElementById('instructor_display').value = instructorNombre;
    }

    function enviarEstado(estado) {
        document.getElementById('estado_pago').value = estado;
    }
</script>
